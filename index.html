<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scranton Manhwa Engine // Munder-Difflin UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f2efe9;
      --paper-white: #fdfbf7;
      --dunder-blue: #1c3b57;
      --dunder-blue-hover: #12283c;
      --dunder-tan: #ded8cb;
      --dunder-tan-dark: #b8af9c;
      --text-main: #24221f;
      --text-muted: #6e6a61;
      --accent-red: #a83232;
      --accent-green: #2d6a4f;
      --border-retro: 2px solid var(--text-main);
      --retro-shadow: 4px 4px 0px var(--text-main);
      --retro-shadow-sm: 2px 2px 0px var(--text-main);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--dunder-tan-dark) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Vintage Desktop Header */
    header {
      background: var(--paper-white);
      border: var(--border-retro);
      box-shadow: var(--retro-shadow);
      padding: 16px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag {
      background: var(--dunder-blue);
      color: var(--paper-white);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 2px;
      font-family: 'Courier Prime', monospace;
    }

    .api-auth-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="password"], input[type="text"], textarea, select {
      background: var(--paper-white);
      border: var(--border-retro);
      padding: 8px 12px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      color: var(--text-main);
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--dunder-blue);
    }

    button {
      background: var(--paper-white);
      border: var(--border-retro);
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--retro-shadow-sm);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--text-main);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--text-main);
    }

    button.btn-primary {
      background: var(--dunder-blue);
      color: var(--paper-white);
    }

    button.btn-primary:hover {
      background: var(--dunder-blue-hover);
    }

    button.btn-green {
      background: var(--accent-green);
      color: var(--paper-white);
    }

    button.btn-danger {
      background: var(--accent-red);
      color: var(--paper-white);
    }

    /* Grid Layout */
    .workspace-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
    }

    @media (max-width: 980px) {
      .workspace-grid { grid-template-columns: 1fr; }
    }

    /* Paper Windows */
    .retro-card {
      background: var(--paper-white);
      border: var(--border-retro);
      box-shadow: var(--retro-shadow);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: var(--dunder-tan);
      border-bottom: var(--border-retro);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .status-badge {
      font-family: 'Courier Prime', monospace;
      font-size: 0.75rem;
      padding: 2px 6px;
      border: 1px solid var(--text-main);
      background: #e4e0d5;
    }

    /* Split Outputs */
    .tabs-nav {
      display: flex;
      border-bottom: var(--border-retro);
      background: var(--dunder-tan);
    }

    .tab-btn {
      border: none;
      border-right: var(--border-retro);
      box-shadow: none;
      padding: 10px 18px;
      background: transparent;
      border-radius: 0;
    }

    .tab-btn.active {
      background: var(--paper-white);
      font-weight: 800;
    }

    .output-box {
      width: 100%;
      height: 480px;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
      background: #faf8f5;
    }

    .actions-footer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .batch-progress-bar {
      height: 12px;
      width: 100%;
      background: var(--dunder-tan);
      border: var(--border-retro);
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Navigation & Login -->
  <header>
    <div class="brand-title">
      📄 Scranton Paper Co. // Manhwa Engine
      <span class="brand-tag">v2.4 LOCAL-STORAGE</span>
    </div>
    <div class="api-auth-bar">
      <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key (Free)" style="width: 260px;" />
      <button class="btn-primary" onclick="saveApiKey()">Save Key</button>
      <span id="authStatus" class="status-badge">NO KEY</span>
    </div>
  </header>

  <div class="workspace-grid">
    <!-- Left Column: Settings & Story Controls -->
    <div class="retro-card">
      <div class="card-header">
        <span>Story Parameters (Bible)</span>
        <button onclick="resetProject()" style="padding: 2px 6px; font-size: 0.7rem;">Reset</button>
      </div>
      <div class="card-body">
        <div>
          <label>Series Title & Genre</label>
          <input type="text" id="storyTitle" style="width:100%" value="Shadow Monarch Rebirth (Dark Fantasy / Dungeons)" />
        </div>
        <div>
          <label>Main Character Specs</label>
          <input type="text" id="mcSpecs" style="width:100%" value="Jin-Woo: Black hair, glowing blue eyes, black dagger, shadow powers" />
        </div>
        <div>
          <label>16:9 Art Style Anchor</label>
          <textarea id="styleAnchor" rows="2" style="width:100%">manhwa webtoon style, solo leveling art, dynamic lighting, sharp lineart, 16:9 widescreen, high contrast</textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label>Current Batch</label>
            <input type="text" id="currentBatchNo" value="1" readonly style="width:100%; background:#e4e0d5;" />
          </div>
          <div>
            <label>Target Total Batches</label>
            <input type="number" id="targetBatches" value="12" min="1" max="100" style="width:100%" />
          </div>
        </div>
        <div>
          <label>Continuity Buffer (Story Memory)</label>
          <textarea id="continuityBuffer" rows="3" style="width:100%">Story starts fresh: MC enters an E-Rank dungeon looking for crystals.</textarea>
        </div>

        <div>
          <label>Execution Status</label>
          <div id="runtimeStatus" style="font-family:'Courier Prime'; font-size:0.8rem; color:var(--text-muted)">Ready to generate.</div>
          <div class="batch-progress-bar">
            <div id="progressBar" class="progress-fill"></div>
          </div>
        </div>

        <div class="actions-footer" style="margin-top: 10px;">
          <button id="startBtn" class="btn-green" style="width:100%; justify-content:center;" onclick="toggleGeneration()">
            ▶ Start Auto-Batch Generation
          </button>
        </div>
      </div>
    </div>

    <!-- Right Column: Output Tabs & Download Center -->
    <div class="retro-card">
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('narrationTab')">1. Voiceover Script (.txt)</button>
        <button class="tab-btn" onclick="switchTab('promptsTab')">2. Google Flow Prompts (.txt)</button>
      </div>
      <div class="card-body">
        <!-- Tab 1: Narration Script -->
        <div id="narrationTab" class="tab-pane">
          <textarea id="narrationOutput" class="output-box" placeholder="Your clean YouTube explanation script will appear here batch by batch..."></textarea>
          <div class="actions-footer">
            <button onclick="downloadTextFile('narration_script.txt', 'narrationOutput')">💾 Download Script (.txt)</button>
            <button onclick="copyToClipboard('narrationOutput')">📋 Copy Script</button>
          </div>
        </div>

        <!-- Tab 2: Google Flow Prompts -->
        <div id="promptsTab" class="tab-pane" style="display:none;">
          <textarea id="promptsOutput" class="output-box" placeholder="Line-by-line 16:9 Manhwa image prompts for Google Flow Agent Mode will appear here..."></textarea>
          <div class="actions-footer">
            <button onclick="downloadTextFile('google_flow_prompts.txt', 'promptsOutput')">💾 Download Prompts (.txt)</button>
            <button onclick="copyToClipboard('promptsOutput')">📋 Copy All Prompts</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let isGenerating = false;

  // Initialize from LocalStorage
  window.onload = function() {
    const savedKey = localStorage.getItem("scranton_gemini_key");
    if (savedKey) {
      document.getElementById("geminiApiKey").value = savedKey;
      document.getElementById("authStatus").innerText = "KEY SAVED";
      document.getElementById("authStatus").style.background = "#cce3de";
    }
    
    // Restore Saved Workspace
    if (localStorage.getItem("scranton_narration")) {
      document.getElementById("narrationOutput").value = localStorage.getItem("scranton_narration");
    }
    if (localStorage.getItem("scranton_prompts")) {
      document.getElementById("promptsOutput").value = localStorage.getItem("scranton_prompts");
    }
    if (localStorage.getItem("scranton_buffer")) {
      document.getElementById("continuityBuffer").value = localStorage.getItem("scranton_buffer");
    }
    if (localStorage.getItem("scranton_batch")) {
      document.getElementById("currentBatchNo").value = localStorage.getItem("scranton_batch");
    }
    updateProgress();
  };

  function saveApiKey() {
    const key = document.getElementById("geminiApiKey").value.trim();
    if (!key) return alert("Please paste a valid Gemini API Key.");
    localStorage.setItem("scranton_gemini_key", key);
    document.getElementById("authStatus").innerText = "KEY SAVED";
    document.getElementById("authStatus").style.background = "#cce3de";
    alert("API Key saved safely inside your browser!");
  }

  function switchTab(tabId) {
    document.querySelectorAll(".tab-pane").forEach(el => el.style.display = "none");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    document.getElementById(tabId).style.display = "block";
    event.target.classList.add("active");
  }

  function updateProgress() {
    const curr = parseInt(document.getElementById("currentBatchNo").value) - 1;
    const total = parseInt(document.getElementById("targetBatches").value);
    const pct = Math.min(100, Math.max(0, (curr / total) * 100));
    document.getElementById("progressBar").style.width = pct + "%";
  }

  async function toggleGeneration() {
    const apiKey = localStorage.getItem("scranton_gemini_key");
    if (!apiKey) return alert("Please enter and save your Gemini API Key first!");

    const btn = document.getElementById("startBtn");
    if (isGenerating) {
      isGenerating = false;
      btn.innerText = "▶ Resume Generation";
      btn.className = "btn-green";
      document.getElementById("runtimeStatus").innerText = "Paused by user.";
      return;
    }

    isGenerating = true;
    btn.innerText = "⏸ Pause Generation";
    btn.className = "btn-danger";

    runBatchLoop(apiKey);
  }

  async function runBatchLoop(apiKey) {
    const totalBatches = parseInt(document.getElementById("targetBatches").value);

    while (isGenerating) {
      let currentBatch = parseInt(document.getElementById("currentBatchNo").value);
      if (currentBatch > totalBatches) {
        document.getElementById("runtimeStatus").innerText = " All batches completed successfully!";
        isGenerating = false;
        document.getElementById("startBtn").innerText = "▶ Start Auto-Batch Generation";
        document.getElementById("startBtn").className = "btn-green";
        break;
      }

      const startScene = (currentBatch - 1) * 50 + 1;
      const endScene = currentBatch * 50;
      const title = document.getElementById("storyTitle").value;
      const mc = document.getElementById("mcSpecs").value;
      const style = document.getElementById("styleAnchor").value;
      const buffer = document.getElementById("continuityBuffer").value;

      document.getElementById("runtimeStatus").innerText = `Writing Batch ${currentBatch}/${totalBatches} (Scenes ${startScene}-${endScene})...`;

      const promptPayload = `
[ROLE: Elite Korean Webtoon/Manhwa Screenwriter & YouTube Narrator]
Story: ${title}
MC Details: ${mc}
Style Anchor: "${style}"

Batch: ${currentBatch} (Scenes ${startScene} to ${endScene})
Continuity Context: ${buffer}

RULES:
1. Har scene ka narration 10-18 words ka conversational Hindi/Hinglish YouTube recap ho (3-5s fast pacing).
2. Har scene ka detailed 16:9 manhwa prompt do.
3. OUTPUT: Strictly Valid Raw JSON only.

JSON Format:
{
  "scenes": [
    {"id": ${startScene}, "narration": "...", "image_prompt": "..."}
  ],
  "next_scene_buffer": "..."
}
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptPayload }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawJsonText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawJsonText);

        if (parsed.scenes && parsed.scenes.length > 0) {
          let narrationsText = "";
          let promptsText = "";

          parsed.scenes.forEach(sc => {
            narrationsText += `[${sc.id}] ${sc.narration}\n\n`;
            promptsText += `${sc.image_prompt}\n`;
          });

          // Append in Textareas
          document.getElementById("narrationOutput").value += narrationsText;
          document.getElementById("promptsOutput").value += promptsText;

          // Update Buffer & Next Batch
          if (parsed.next_scene_buffer) {
            document.getElementById("continuityBuffer").value = parsed.next_scene_buffer;
          }
          document.getElementById("currentBatchNo").value = currentBatch + 1;

          // Save everything to browser's LocalStorage
          localStorage.setItem("scranton_narration", document.getElementById("narrationOutput").value);
          localStorage.setItem("scranton_prompts", document.getElementById("promptsOutput").value);
          localStorage.setItem("scranton_buffer", document.getElementById("continuityBuffer").value);
          localStorage.setItem("scranton_batch", currentBatch + 1);

          updateProgress();
        }

        // Wait 2 seconds to respect free-tier rate limits
        await new Promise(r => setTimeout(r, 2000));

      } catch (err) {
        console.error(err);
        document.getElementById("runtimeStatus").innerText = `⚠️ Error on Batch ${currentBatch}: ${err.message}`;
        isGenerating = false;
        document.getElementById("startBtn").innerText = "▶ Retry Batch";
        document.getElementById("startBtn").className = "btn-green";
        break;
      }
    }
  }

  function downloadTextFile(filename, elementId) {
    const text = document.getElementById(elementId).value;
    if (!text) return alert("Nothing to download!");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).value;
    navigator.clipboard.writeText(text);
    alert("Copied to clipboard!");
  }

  function resetProject() {
    if (confirm("Reset current story and start a new project?")) {
      localStorage.removeItem("scranton_narration");
      localStorage.removeItem("scranton_prompts");
      localStorage.removeItem("scranton_buffer");
      localStorage.removeItem("scranton_batch");
      location.reload();
    }
  }
</script>
</body>
</html>
