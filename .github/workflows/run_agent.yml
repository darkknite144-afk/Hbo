name: Auto-Generate Manhwa Script

on:
  workflow_dispatch: # Yeh line GitHub par ek "Run Workflow" button add karti hai

jobs:
  generate-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Output files ko repo me wapas save karne ki permission
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Script on GitHub Server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_api.py

      - name: Commit and Save Files to GitHub
        run: |
          git config --global user.name "GitHub-Actions-Bot"
          git config --global user.email "actions@github.com"
          git add output/
          git commit -m "Generated new Manhwa script batch" || echo "No changes to commit"
          git push
